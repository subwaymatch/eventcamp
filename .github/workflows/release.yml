name: Package templates

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ship only what passes the checks.
      - name: Verify
        run: npm test

      - name: Create archives
        run: |
          set -euo pipefail
          mkdir -p dist

          # One archive per theme, each a self-contained site, plus a
          # combined archive holding all three.
          for theme in templates/*/; do
            name="$(basename "$theme")"
            (cd templates && zip -rq "../dist/eventcamp-${name}-${GITHUB_REF_NAME}.zip" "$name")
          done

          (cd templates && zip -rq "../dist/eventcamp-all-themes-${GITHUB_REF_NAME}.zip" .)

          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
